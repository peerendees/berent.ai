<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt - BERENT | Beratung + Entwicklung</title>
    <link href="output.css" rel="stylesheet">
    <link rel="icon" href="images/logo-kompakt-farbe.webp" type="image/webp">
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100">
    <!-- Navigation -->
    <nav class="fixed w-full bg-white shadow-lg z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-3">
                <div class="flex items-center">
                    <a href="/" class="flex items-center">
                        <img src="images/logo_farbe_v3.webp" alt="BERENT Logo" class="h-20 mr-2 my-1" width="auto">
                    </a>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="/apps" class="text-gray-600 hover:text-[#D6B366] transition-colors duration-300">Apps</a>
                    <a href="/guides" class="text-gray-600 hover:text-[#D6B366] transition-colors duration-300">Guides</a>
                    <a href="/buch" class="text-gray-600 hover:text-[#D6B366] transition-colors duration-300">Buch</a>
                    <a href="/profil" class="text-gray-600 hover:text-[#D6B366] transition-colors duration-300">Über mich</a>
                    <a href="/kontakt" class="text-[#D6B366] font-semibold">Kontakt</a>
                </div>
                <div class="md:hidden">
                    <button aria-label="Menü öffnen" id="mobile-menu-button" class="text-gray-600 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-[#D6B366]">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div id="mobile-menu" class="hidden bg-white md:hidden shadow-lg">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="/apps" class="block px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:text-[#D6B366] hover:bg-gray-50 transition-colors duration-300">Apps</a>
                <a href="/guides" class="block px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:text-[#D6B366] hover:bg-gray-50 transition-colors duration-300">Guides</a>
                <a href="/buch" class="block px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:text-[#D6B366] hover:bg-gray-50 transition-colors duration-300">Buch</a>
                <a href="/profil" class="block px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:text-[#D6B366] hover:bg-gray-50 transition-colors duration-300">Über mich</a>
                <a href="/kontakt" class="block px-3 py-2 rounded-md text-base font-medium text-[#D6B366]">Kontakt</a>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="pt-32 pb-20">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-4xl font-bold mb-4 text-[#80331A]">Kontakt</h1>
            <p class="text-gray-600 mb-8 text-lg">Du hast ein Anliegen oder möchtest zusammenarbeiten? Schreib mir.</p>

            <div class="bg-white rounded-lg shadow-lg p-8">
                <p class="text-gray-600 mb-6">
                    E-Mail: <span class="font-semibold text-[#80331A]">office [at] berent [.] ai</span>
                </p>
                <form action="#" method="POST" class="space-y-6">
                    <div class="flex flex-col md:flex-row md:space-x-4">
                        <div class="flex-1 mb-4 md:mb-0">
                            <label for="vorname" class="block mb-1 text-sm font-medium text-gray-700">Vorname*</label>
                            <input type="text" id="vorname" name="vorname" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#D6B366] focus:border-[#D6B366] outline-none">
                        </div>
                        <div class="flex-1">
                            <label for="name" class="block mb-1 text-sm font-medium text-gray-700">Name</label>
                            <input type="text" id="name" name="name" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#D6B366] focus:border-[#D6B366] outline-none">
                        </div>
                    </div>
                    <div>
                        <label for="email" class="block mb-1 text-sm font-medium text-gray-700">E-Mail-Adresse*</label>
                        <input type="email" id="email" name="email" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#D6B366] focus:border-[#D6B366] outline-none">
                    </div>
                    <div>
                        <label for="anliegen" class="block mb-1 text-sm font-medium text-gray-700">Mein Anliegen</label>
                        <textarea id="anliegen" name="anliegen" rows="5" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#D6B366] focus:border-[#D6B366] outline-none" placeholder="Beschreibe kurz, worum es geht..."></textarea>
                    </div>
                    <div class="flex items-start">
                        <input id="zustimmung" name="zustimmung" type="checkbox" required class="mr-2 mt-1 h-4 w-4 rounded border-gray-300 text-[#D6B366] focus:ring-[#D6B366]">
                        <label for="zustimmung" class="text-sm text-gray-600">Ich bin damit einverstanden, dass diese Daten zum Zweck der Kontaktaufnahme gespeichert und verarbeitet werden. Mir ist bekannt, dass ich meine Einwilligung jederzeit widerrufen kann.*</label>
                    </div>
                    <div>
                        <button type="submit" class="px-8 py-3 bg-[#80331A] text-white font-semibold rounded-lg hover:bg-[#A0522D] transition-colors duration-300">
                            Nachricht senden
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-wrap justify-between items-center">
                <p class="text-gray-400 text-sm">© 2026 BERENT | Beratung + Entwicklung</p>
                <div class="flex flex-wrap gap-4 text-sm">
                    <a href="/impressum" class="text-gray-400 hover:text-[#D6B366] transition-colors duration-300">Impressum</a>
                    <a href="/datenschutz" class="text-gray-400 hover:text-[#D6B366] transition-colors duration-300">Datenschutz</a>
                    <a href="/showcase" class="text-gray-400 hover:text-[#D6B366] transition-colors duration-300">Projekte</a>
                    <a href="https://linkedin.com/in/berentai" target="_blank" class="text-gray-400 hover:text-[#D6B366] transition-colors duration-300">LinkedIn</a>
                    <a href="https://instagram.com/berent.ai" target="_blank" class="text-gray-400 hover:text-[#D6B366] transition-colors duration-300">Instagram</a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        mobileMenuButton.addEventListener('click', () => { mobileMenu.classList.toggle('hidden'); });
        mobileMenu.querySelectorAll('a').forEach(link => { link.addEventListener('click', () => { mobileMenu.classList.add('hidden'); }); });
    </script>
</body>
</html>
