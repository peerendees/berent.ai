name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Release Type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  
jobs:
  version-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build site
        run: npm run build

      - name: Test deployment (simplified)
        run: |
          echo "Build erfolgreich!"
          echo "Dateien in dist/:"
          ls -la dist/
          echo "index.html Größe:"
          wc -l dist/index.html 