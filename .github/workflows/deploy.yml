name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Release Type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  
jobs:
  version-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build site
        run: npm run build

      - name: SFTP Deploy to IONOS (verbessert)
        uses: cross-the-world/scp-pipeline@v1.1.0
        with:
          host: ${{ secrets.SFTP_SERVER }}
          user: ${{ secrets.SFTP_USERNAME }}
          pass: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          connect_timeout: 30s
          local: ./dist/
          remote: /
          debug: true 